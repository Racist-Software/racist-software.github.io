<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Username Availability Checker</title>
    <style>
        body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
        #output { margin-top: 20px; white-space: pre-wrap; }
        .available { color: #44ff44; font-weight: bold; }
        .error { color: #ff4444; }
        .info { color: #ffcc00; }
        button { background: #0f0; color: #111; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <h2>TikTok Username Availability Checker</h2>
    <p>Generates random 4-letter usernames and checks if they are available on TikTok.</p>
    <button id="startBtn">Start Searching</button>
    <div id="output"></div>

    <script>
        (function() {
            const output = document.getElementById('output');
            const startBtn = document.getElementById('startBtn');

            // CORS proxy to bypass cross-origin restrictions.
            // Note: Public proxies may be rate-limited or blocked.
            const CORS_PROXY = 'https://api.allorigins.win/raw?url=';

            // TikTok profile URL pattern
            const TIKTOK_URL = 'https://www.tiktok.com/@';

            // Delay between requests (ms) to avoid rate limiting
            const DELAY_MS = 1500;

            // Maximum attempts before stopping (safety limit)
            const MAX_ATTEMPTS = 1000;

            let isSearching = false;

            // Generate a random 4-letter lowercase string
            function randomUsername() {
                const letters = 'abcdefghijklmnopqrstuvwxyz';
                let result = '';
                for (let i = 0; i < 4; i++) {
                    result += letters.charAt(Math.floor(Math.random() * letters.length));
                }
                return result;
            }

            // Check if a TikTok username exists.
            // Returns true if the username EXISTS (i.e., taken), false if AVAILABLE.
            async function usernameExists(username) {
                const targetUrl = TIKTOK_URL + username;
                const proxyUrl = CORS_PROXY + encodeURIComponent(targetUrl);

                try {
                    const response = await fetch(proxyUrl, {
                        method: 'GET',
                        headers: {
                            'Accept': 'text/html,application/xhtml+xml'
                        }
                    });

                    // If the response is 404, the user does not exist -> available
                    if (response.status === 404) {
                        return false;
                    }

                    // If status is not 200, treat as error and assume taken to be safe
                    if (response.status !== 200) {
                        return true;
                    }

                    const html = await response.text();

                    // TikTok's "user not found" page contains specific phrases.
                    // Common indicators: "Couldn't find this account", "This account doesn't exist"
                    const notFoundPatterns = [
                        /Couldn't find this account/i,
                        /This account doesn't exist/i,
                        /User not found/i,
                        /No results found/i
                    ];

                    for (const pattern of notFoundPatterns) {
                        if (pattern.test(html)) {
                            return false; // Available
                        }
                    }

                    // If none of the not-found patterns matched, assume the user exists.
                    return true;
                } catch (err) {
                    // On network error, log and assume the username is taken (to avoid false positives)
                    console.error(`Error checking ${username}:`, err);
                    return true;
                }
            }

            // Sleep helper
            function sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            // Main search loop
            async function searchLoop() {
                if (isSearching) return;
                isSearching = true;
                startBtn.disabled = true;
                output.innerHTML = '';

                let attempt = 0;
                let found = false;

                while (attempt < MAX_ATTEMPTS && isSearching) {
                    attempt++;
                    const username = randomUsername();

                    output.innerHTML += `<div class="info">Attempt ${attempt}: Checking @${username}...</div>`;
                    // Auto-scroll to bottom
                    window.scrollTo(0, document.body.scrollHeight);

                    const exists = await usernameExists(username);

                    if (!exists) {
                        // Username is available
                        output.innerHTML += `<div class="available">✅ AVAILABLE: @${username}</div>`;
                        window.scrollTo(0, document.body.scrollHeight);
                        found = true;
                        break;
                    } else {
                        output.innerHTML += `<div>@${username} is taken.</div>`;
                        window.scrollTo(0, document.body.scrollHeight);
                    }

                    // Delay before next request
                    await sleep(DELAY_MS);
                }

                if (!found && isSearching) {
                    output.innerHTML += `<div class="error">Search stopped after ${attempt} attempts without finding an available username.</div>`;
                }

                isSearching = false;
                startBtn.disabled = false;
            }

            // Start button handler
            startBtn.addEventListener('click', () => {
                if (isSearching) {
                    isSearching = false; // signal stop
                    startBtn.disabled = true;
                    output.innerHTML += '<div class="error">Search cancelled by user.</div>';
                    setTimeout(() => { startBtn.disabled = false; }, 500);
                } else {
                    searchLoop();
                }
            });
        })();
    </script>
</body>
</html>
