<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Username Checker (Accurate)</title>
    <style>
        body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
        #output { margin-top: 20px; white-space: pre-wrap; max-height: 400px; overflow-y: auto; border: 1px solid #333; padding: 10px; }
        .available { color: #44ff44; font-weight: bold; font-size: 1.2em; }
        .error { color: #ff4444; }
        .info { color: #ffcc00; }
        button { background: #0f0; color: #111; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; margin-right: 10px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #stats { margin-top: 10px; color: #aaa; }
    </style>
</head>
<body>
    <h2>TikTok Username Availability Checker</h2>
    <p>Generates random 4-letter usernames and checks availability reliably.</p>
    <button id="startBtn">Start Searching</button>
    <button id="stopBtn" disabled>Stop</button>
    <div id="stats">Attempts: 0 | Checked: 0 | Speed: 0/s</div>
    <div id="output"></div>

    <script>
        (function() {
            const output = document.getElementById('output');
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            const statsDiv = document.getElementById('stats');

            // Use allorigins JSON endpoint for reliable status codes
            const PROXY_BASE = 'https://api.allorigins.win/get?url=';
            const TIKTOK_URL = 'https://www.tiktok.com/@';

            // Concurrency: number of parallel requests. Keep moderate to avoid rate limiting.
            const CONCURRENCY = 20;
            // Delay per request per worker (ms)
            const REQUEST_DELAY = 50;
            // Retry attempts on network error
            const MAX_RETRIES = 3;
            // Safety limit
            const MAX_ATTEMPTS = 1000000;

            let isSearching = false;
            let found = false;
            let attempts = 0;
            let checked = 0;
            let startTime = 0;
            let speedInterval = null;
            const controllers = new Set();

            function randomUsername() {
                const letters = 'abcdefghijklmnopqrstuvwxyz';
                let result = '';
                for (let i = 0; i < 4; i++) {
                    result += letters.charAt(Math.floor(Math.random() * letters.length));
                }
                return result;
            }

            // Sleep helper
            function sleep(ms) {
                return new Promise(r => setTimeout(r, ms));
            }

            // Check username existence. Returns true if taken, false if available, null on error.
            async function checkUsername(username) {
                const targetUrl = TIKTOK_URL + username;
                const proxyUrl = PROXY_BASE + encodeURIComponent(targetUrl);
                const controller = new AbortController();
                controllers.add(controller);

                for (let attempt = 0; attempt < MAX_RETRIES; attempt++) {
                    try {
                        const response = await fetch(proxyUrl, {
                            method: 'GET',
                            signal: controller.signal
                        });

                        if (!response.ok) {
                            // Proxy error, retry
                            await sleep(200);
                            continue;
                        }

                        const json = await response.json();
                        const httpCode = json.status?.http_code;
                        const contents = json.contents || '';

                        // If TikTok returned 404, user does not exist
                        if (httpCode === 404) {
                            return false; // available
                        }

                        // If status is not 200, treat as error and retry
                        if (httpCode !== 200) {
                            await sleep(200);
                            continue;
                        }

                        // Check for "not found" patterns in the HTML
                        const notFoundPatterns = [
                            /Couldn't find this account/i,
                            /This account doesn't exist/i,
                            /User not found/i,
                            /No results found/i,
                            /<title>.*?TikTok<\/title>/i // generic title might indicate error page? but can be false
                        ];

                        // More reliable: check for presence of specific meta tags that exist on real profiles
                        // Real profiles contain: <meta property="og:title" content="... (@username) TikTok">
                        // or a script with "uniqueId":"username"
                        const takenIndicators = [
                            new RegExp(`"uniqueId":"${username}"`, 'i'),
                            new RegExp(`@${username}`, 'i'),
                            /"userInfo":\{/i,
                            /"itemList":/i
                        ];

                        // If any taken indicator is present, assume taken.
                        for (const pattern of takenIndicators) {
                            if (pattern.test(contents)) {
                                return true; // taken
                            }
                        }

                        // If none of the taken indicators match, check not-found patterns
                        for (const pattern of notFoundPatterns) {
                            if (pattern.test(contents)) {
                                return false; // available
                            }
                        }

                        // Default: if we can't determine, treat as taken (conservative)
                        return true;
                    } catch (err) {
                        if (err.name === 'AbortError') return null;
                        await sleep(200);
                    }
                }
                return null; // all retries failed
            }

            async function worker() {
                while (isSearching && !found && attempts < MAX_ATTEMPTS) {
                    const username = randomUsername();
                    attempts++;
                    const exists = await checkUsername(username);
                    if (exists === false) {
                        found = true;
                        isSearching = false;
                        for (const c of controllers) c.abort();
                        controllers.clear();
                        output.innerHTML = `<div class="available">✅ AVAILABLE: @${username}</div>`;
                        break;
                    }
                    if (exists !== null) checked++;
                    await sleep(REQUEST_DELAY);
                }
            }

            function updateStats() {
                const elapsed = (Date.now() - startTime) / 1000;
                const speed = elapsed > 0 ? (checked / elapsed).toFixed(0) : 0;
                statsDiv.textContent = `Attempts: ${attempts} | Checked: ${checked} | Speed: ${speed}/s`;
            }

            async function startSearch() {
                if (isSearching) return;
                isSearching = true;
                found = false;
                attempts = 0;
                checked = 0;
                startTime = Date.now();
                output.innerHTML = '';
                startBtn.disabled = true;
                stopBtn.disabled = false;

                speedInterval = setInterval(updateStats, 500);

                const workers = [];
                for (let i = 0; i < CONCURRENCY; i++) {
                    workers.push(worker());
                }

                await Promise.all(workers);

                clearInterval(speedInterval);
                updateStats();
                isSearching = false;
                startBtn.disabled = false;
                stopBtn.disabled = true;

                if (!found) {
                    output.innerHTML += `<div class="error">Search stopped after ${attempts} attempts. No available username found.</div>`;
                }
            }

            function stopSearch() {
                if (!isSearching) return;
                isSearching = false;
                for (const c of controllers) c.abort();
                controllers.clear();
                output.innerHTML += `<div class="error">Search cancelled by user.</div>`;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                clearInterval(speedInterval);
            }

            startBtn.addEventListener('click', startSearch);
            stopBtn.addEventListener('click', stopSearch);
        })();
    </script>
</body>
</html>
