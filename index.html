<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Username Checker (instantusername API)</title>
    <style>
        body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
        #log { margin-top: 20px; white-space: pre-wrap; max-height: 500px; overflow-y: auto; border: 1px solid #333; padding: 10px; font-size: 13px; }
        .available { color: #44ff44; font-weight: bold; }
        .taken { color: #ff6666; }
        .error { color: #ffaa00; }
        .info { color: #ffcc00; }
        button { background: #0f0; color: #111; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; margin-right: 10px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #stats { margin-top: 10px; color: #aaa; }
    </style>
</head>
<body>
    <h2>TikTok Username Availability Checker</h2>
    <p>Uses instantusername.com API. Generates 4-letter usernames at 20/sec, checks each within 5 seconds.</p>
    <button id="startBtn">Start</button>
    <button id="stopBtn" disabled>Stop</button>
    <button id="clearBtn">Clear Log</button>
    <div id="stats">Attempts: 0 | Checked: 0 | Speed: 0/s | Queue: 0</div>
    <div id="log"></div>

    <script>
        (function() {
            const logDiv = document.getElementById('log');
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            const clearBtn = document.getElementById('clearBtn');
            const statsDiv = document.getElementById('stats');

            // instantusername.com API base URL discovered from page preconnect
            const API_BASE = 'https://api.instantusername.com';
            // Endpoint pattern inferred from the project's mock server: /check/:platform/:username
            const CHECK_ENDPOINT = (username) => `${API_BASE}/check/tiktok/${username}`;

            // Generation rate: 20 per second -> one every 50ms
            const GEN_INTERVAL_MS = 50;
            // Maximum concurrent requests (workers)
            const CONCURRENCY = 50;
            // Per-request timeout (5 seconds)
            const REQUEST_TIMEOUT_MS = 5000;
            // Maximum retries per request on network error
            const MAX_RETRIES = 2;
            // Safety limit
            const MAX_ATTEMPTS = 1000000;

            let isSearching = false;
            let found = false;
            let attempts = 0;
            let checked = 0;
            let startTime = 0;
            let speedInterval = null;
            let genInterval = null;
            const activeControllers = new Set();

            const queue = [];
            let activeWorkers = 0;

            function randomUsername() {
                const letters = 'abcdefghijklmnopqrstuvwxyz';
                let result = '';
                for (let i = 0; i < 4; i++) {
                    result += letters.charAt(Math.floor(Math.random() * letters.length));
                }
                return result;
            }

            function sleep(ms) {
                return new Promise(r => setTimeout(r, ms));
            }

            function appendLog(text, className = '') {
                const line = document.createElement('div');
                line.className = className;
                line.textContent = text;
                logDiv.appendChild(line);
                logDiv.scrollTop = logDiv.scrollHeight;
            }

            async function checkUsername(username) {
                const url = CHECK_ENDPOINT(username);
                const controller = new AbortController();
                activeControllers.add(controller);
                const timeoutId = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

                for (let attempt = 0; attempt < MAX_RETRIES; attempt++) {
                    try {
                        const response = await fetch(url, {
                            method: 'GET',
                            signal: controller.signal,
                            headers: { 'Accept': 'application/json' }
                        });

                        if (!response.ok) {
                            if (attempt < MAX_RETRIES - 1) {
                                await sleep(300);
                                continue;
                            }
                            clearTimeout(timeoutId);
                            activeControllers.delete(controller);
                            return null;
                        }

                        const data = await response.json();
                        // Expected shape: { service, url, available, message }
                        clearTimeout(timeoutId);
                        activeControllers.delete(controller);
                        if (typeof data.available === 'boolean') {
                            return data.available; // true = available, false = taken
                        }
                        return null; // unexpected response
                    } catch (err) {
                        if (err.name === 'AbortError') {
                            clearTimeout(timeoutId);
                            activeControllers.delete(controller);
                            return null;
                        }
                        if (attempt < MAX_RETRIES - 1) {
                            await sleep(300);
                            continue;
                        }
                        clearTimeout(timeoutId);
                        activeControllers.delete(controller);
                        return null;
                    }
                }
                clearTimeout(timeoutId);
                activeControllers.delete(controller);
                return null;
            }

            async function worker() {
                while (isSearching && !found) {
                    if (queue.length === 0) {
                        await sleep(10);
                        continue;
                    }
                    const username = queue.shift();
                    if (!username) continue;
                    attempts++;
                    const available = await checkUsername(username);
                    if (available === true) {
                        found = true;
                        isSearching = false;
                        for (const c of activeControllers) c.abort();
                        activeControllers.clear();
                        queue.length = 0;
                        appendLog(`✅ AVAILABLE: @${username}`, 'available');
                        break;
                    } else if (available === false) {
                        appendLog(`❌ @${username} is taken`, 'taken');
                    } else {
                        appendLog(`⚠️ @${username} check failed`, 'error');
                    }
                    if (available !== null) checked++;
                }
            }

            function updateStats() {
                const elapsed = (Date.now() - startTime) / 1000;
                const speed = elapsed > 0 ? (checked / elapsed).toFixed(1) : 0;
                statsDiv.textContent = `Attempts: ${attempts} | Checked: ${checked} | Speed: ${speed}/s | Queue: ${queue.length} | Workers: ${activeWorkers}`;
            }

            function startSearch() {
                if (isSearching) return;
                isSearching = true;
                found = false;
                attempts = 0;
                checked = 0;
                startTime = Date.now();
                queue.length = 0;
                logDiv.innerHTML = '';
                startBtn.disabled = true;
                stopBtn.disabled = false;

                speedInterval = setInterval(updateStats, 500);

                for (let i = 0; i < CONCURRENCY; i++) {
                    activeWorkers++;
                    worker().finally(() => { activeWorkers--; });
                }

                genInterval = setInterval(() => {
                    if (!isSearching || found) {
                        clearInterval(genInterval);
                        return;
                    }
                    if (attempts >= MAX_ATTEMPTS) {
                        isSearching = false;
                        clearInterval(genInterval);
                        return;
                    }
                    queue.push(randomUsername());
                }, GEN_INTERVAL_MS);

                const checkDone = setInterval(() => {
                    if (!isSearching && queue.length === 0 && activeWorkers === 0) {
                        clearInterval(checkDone);
                        clearInterval(speedInterval);
                        clearInterval(genInterval);
                        updateStats();
                        startBtn.disabled = false;
                        stopBtn.disabled = true;
                        if (!found) {
                            appendLog('Search stopped. No available username found.', 'error');
                        }
                    }
                }, 200);
            }

            function stopSearch() {
                if (!isSearching) return;
                isSearching = false;
                clearInterval(genInterval);
                for (const c of activeControllers) c.abort();
                activeControllers.clear();
                queue.length = 0;
                appendLog('Search cancelled by user.', 'error');
                startBtn.disabled = false;
                stopBtn.disabled = true;
                clearInterval(speedInterval);
            }

            clearBtn.addEventListener('click', () => {
                logDiv.innerHTML = '';
            });

            startBtn.addEventListener('click', startSearch);
            stopBtn.addEventListener('click', stopSearch);
        })();
    </script>
</body>
</html>
